name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
      # CI only runs the fixture corpus (first-party content). Corpus scans
      # of third-party repositories happen in the private triage repository,
      # so unreviewed findings never appear in public CI logs.
      - run: skillcheck rules
