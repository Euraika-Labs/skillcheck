[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skillcheck"
version = "0.1.0"
description = "Deterministic scanner for Agent Skills, hooks and MCP server manifests: exfiltration paths, hidden instructions, over-broad capability."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Euraika", email = "info@euraika.net" }
]
keywords = [
  "security",
  "static-analysis",
  "agent-skills",
  "mcp",
  "claude-code",
  "supply-chain",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = [
  "pydantic>=2.8",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
skillcheck = "skillcheck.cli:main"

[tool.setuptools.packages.find]
include = ["skillcheck*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
